<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 47 · 自定义 MCP Server — JSON-RPC 握手可视化</title>
<style>
  :root{--bg:#0e1117;--card:#161b22;--line:#283143;--fg:#e6edf3;--mut:#8b949e;--accent:#58a6ff;--ok:#3fb950;--warn:#f0883e;--bad:#da3633}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,"PingFang SC",Segoe UI,sans-serif}
  header{padding:24px 24px 6px;text-align:center}
  h1{margin:0;font-size:23px} .sub{color:var(--mut);margin-top:6px}
  .wrap{max-width:1080px;margin:0 auto;padding:14px;display:grid;gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  h2{margin:0 0 10px;font-size:16px} h2 small{color:var(--mut);font-weight:400;font-size:12px}
  canvas{width:100%;background:#0b0f15;border-radius:8px;display:block}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
  button{background:var(--accent);color:#06121f;border:0;padding:8px 16px;border-radius:8px;font-weight:600;cursor:pointer}
  button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
  p.note{color:var(--mut);font-size:13px;margin:8px 0 0}
  .stat{font-variant-numeric:tabular-nums;color:var(--ok);font-weight:600}
</style>
</head>
<body>
<header>
  <h1>Day 47 · 自定义 MCP Server</h1>
  <div class="sub">单步走 Client↔Server 的 JSON-RPC 往返：initialize 握手 → tools/list 发现 → tools/call 执行，看每条报文走过 stdio 管道</div>
</header>
<div class="wrap">
  <div class="card">
    <h2>① MCP stdio · JSON-RPC 往返 <small>蓝=请求出 绿=响应回 灰=未到</small></h2>
    <canvas id="cv" width="1040" height="300"></canvas>
    <div class="row">
      <button id="step">▶ 单步执行</button>
      <button class="ghost" id="reset">重置</button>
      <span class="stat" id="stat">第 0 步 / 等待开始</span>
    </div>
    <p class="note">Client 用 subprocess 拉起 Server，stdin 发请求、stdout 收结果，一行一条。这套手写的 server 能原样挂进 Claude Desktop/Code。</p>
  </div>
</div>
<script>
const cv=document.getElementById('cv'),x=cv.getContext('2d'),stat=document.getElementById('stat');
// 5 步：每步一条 JSON-RPC 报文（方向: req=client->server, res=server->client）
const S=[
 {dir:'req',m:'initialize',d:'protocolVersion 2024-11-05'},
 {dir:'res',m:'result',    d:'serverInfo: day47-notes'},
 {dir:'req',m:'tools/list',d:'问: 你有哪些工具?'},
 {dir:'res',m:'result',    d:'[note_add, note_list, list_files]'},
 {dir:'req',m:'tools/call',d:'note_add(text="Day47 MCP")'},
 {dir:'res',m:'result',    d:'content: 已存为 #1'},
];
let i=0;
function draw(){
 x.fillStyle='#0b0f15';x.fillRect(0,0,1040,300);
 const cx=180,sx=860,cy=58;
 // 两个节点框
 x.fillStyle='#11202f';x.strokeStyle='#58a6ff';x.lineWidth=2;
 x.fillRect(cx-110,cy,220,46);x.strokeRect(cx-110,cy,220,46);
 x.fillRect(sx-110,cy,220,46);x.strokeRect(sx-110,cy,220,46);
 x.fillStyle='#e6edf3';x.font='15px sans-serif';x.textAlign='center';
 x.fillText('Client (subprocess)',cx,cy+28);x.fillText('MCP Server (stdio)',sx,cy+28);
 x.fillStyle='#8b949e';x.font='12px sans-serif';
 x.fillText('uv run practice.py',cx,cy-8);x.fillText('--serve · stdin/stdout',sx,cy-8);
 // 6 条往返线，逐步点亮
 for(let k=0;k<S.length;k++){
  const y=120+k*28, done=k<i, cur=k===i-1, s=S[k], r2l=s.dir==='res';
  x.strokeStyle=done?(r2l?'#3fb950':'#58a6ff'):'#283143';x.lineWidth=cur?3:1.5;
  x.beginPath();x.moveTo(r2l?sx-110:cx+110,y);x.lineTo(r2l?cx+110:sx-110,y);x.stroke();
  // 箭头
  if(done){x.fillStyle=r2l?'#3fb950':'#58a6ff';const ax=r2l?cx+110:sx-110;
   x.beginPath();x.moveTo(ax,y);x.lineTo(ax+(r2l?12:-12),y-5);x.lineTo(ax+(r2l?12:-12),y+5);x.fill();}
  x.fillStyle=done?'#e6edf3':'#444c56';x.font='12px monospace';x.textAlign='left';
  x.fillText((r2l?'◀ ':'▶ ')+s.m+': '+s.d,210,y-5);
 }
 stat.textContent=i===0?'第 0 步 / 等待开始':(i>=S.length?'✅ 握手+调用完成 — server 可挂 Claude Desktop':`第 ${i} 步 / ${S[i-1].dir==='req'?'Client→Server':'Server→Client'} ${S[i-1].m}`);
}
document.getElementById('step').onclick=()=>{if(i<S.length)i++;draw();};
document.getElementById('reset').onclick=()=>{i=0;draw();};
draw();
</script>
</body>
</html>
