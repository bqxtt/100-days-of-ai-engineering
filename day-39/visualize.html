<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 39 · Agent 人在回路 + checkpoint 持久化</title>
<style>
  :root{--bg:#0e1117;--card:#161b22;--line:#283143;--fg:#e6edf3;--mut:#8b949e;--accent:#58a6ff;--ok:#3fb950;--warn:#f0883e;--bad:#da3633}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,"PingFang SC",Segoe UI,sans-serif}
  header{padding:22px 24px 4px;text-align:center}
  h1{margin:0;font-size:22px} .sub{color:var(--mut);margin-top:6px;font-size:13px}
  .wrap{max-width:1000px;margin:0 auto;padding:14px;display:grid;gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  canvas{width:100%;background:#0b0f15;border-radius:8px;display:block}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
  button{background:var(--accent);color:#06121f;border:0;padding:8px 16px;border-radius:8px;font-weight:600;cursor:pointer}
  button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
  button.warn{background:var(--warn);color:#1a0f02} button:disabled{opacity:.4;cursor:not-allowed}
  .tag{font-size:12px;color:var(--mut)} b.ok{color:var(--ok)} b.bad{color:var(--bad)} b.warn{color:var(--warn)}
</style></head>
<body>
<header><h1>Day 39 · Human-in-the-loop + Checkpoint 持久化</h1>
<div class="sub">点「下一步」让 Agent 跑 · 到高危 delete_db 会 ⏸ 暂停等审批 · 每步把 state 存进右侧 checkpoint</div></header>
<div class="wrap">
  <div class="card"><canvas id="c" width="960" height="420"></canvas>
    <div class="row">
      <button id="next">下一步 ▶</button>
      <button id="approve" class="warn" disabled>👤 APPROVE 高危操作</button>
      <button id="reset" class="ghost">重置 ↺</button>
      <span class="tag" id="status"></span>
    </div></div>
</div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
const PLAN=[{t:'archive',a:'alice',risk:0},{t:'delete_db',a:'old_logs',risk:1},{t:'query_db',a:'alice',risk:0}];
let S; const reset=()=>{S={i:0,phase:'idle',log:[],pending:null,approved:false};draw();};
const stat=document.getElementById('status'),bN=document.getElementById('next'),bA=document.getElementById('approve');
function rr(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath();}
function box(x,y,w,h,c,bg){X.fillStyle=bg||'#0b0f15';rr(x,y,w,h,8);X.fill();X.strokeStyle=c;X.lineWidth=2;X.stroke();}
function txt(s,x,y,c,sz,al){X.fillStyle=c;X.font=(sz||13)+'px -apple-system,PingFang SC,sans-serif';X.textAlign=al||'left';X.fillText(s,x,y);}
function draw(){
  X.fillStyle='#0b0f15';X.fillRect(0,0,960,420);
  txt('Agent Loop（LLM 决策→工具）',24,28,'#8b949e',13);
  PLAN.forEach((p,k)=>{const x=24+k*150,y=48,done=k<S.i,cur=k===S.i;
    let c='#283143',bg='#0b0f15';if(done){c='#3fb950';bg='#10241a'}if(cur&&S.phase==='wait'){c='#da3633';bg='#2a0f0f'}else if(cur&&S.phase!=='done'){c='#58a6ff';bg='#0d1b2e'}
    box(x,y,135,64,c,bg);txt((p.risk?'⚠ ':'')+p.t,x+12,y+26,p.risk?'#f0883e':'#e6edf3',14);txt(p.a,x+12,y+46,'#8b949e',12);
    if(k<PLAN.length-1){txt('→',x+140,y+40,'#3a4556',18);}});
  // interrupt gate
  box(24,160,440,140,S.phase==='wait'?'#da3633':'#283143',S.phase==='wait'?'#2a0f0f':'#0b0f15');
  txt('⏸ INTERRUPT · 人在回路审批',40,188,S.phase==='wait'?'#da3633':'#8b949e',14);
  txt(S.phase==='wait'?'高危 delete_db(old_logs) 待人工 APPROVE':'低风险动作直接放行，高危才停',40,214,'#e6edf3',13);
  txt(S.phase==='wait'?'→ 进程可退出/崩溃，state 已存盘':'point=不可逆动作必须人审',40,238,'#8b949e',12);
  // checkpoint
  box(500,160,436,140,'#283143','#0b0f15');txt('💾 .checkpoint.json（持久化）',516,188,'#58a6ff',14);
  txt('step:'+S.i+'  approved:'+S.approved+'  pending:'+(S.pending||'-'),516,214,'#8b949e',12);
  txt('log: '+(S.log.join(' / ')||'(空)'),516,238,'#8b949e',12);
  txt(S.phase==='done'?'✅ 任务结束':'每步落盘→崩了能 resume',516,262,'#3fb950',12);
  stat.innerHTML=S.phase==='wait'?'<b class="bad">挂起：等审批</b>':S.phase==='done'?'<b class="ok">完成</b>':'步 '+S.i+'/3';
  bA.disabled=S.phase!=='wait';bN.disabled=S.phase==='wait'||S.phase==='done';
}
bN.onclick=()=>{const p=PLAN[S.i];if(!p){S.phase='done';return draw();}
  if(p.risk&&!S.approved){S.phase='wait';S.pending=p.a;return draw();}
  S.log.push(p.t+'('+p.a+')');S.i++;S.approved=false;S.pending=null;S.phase=S.i>=PLAN.length?'done':'run';draw();};
bA.onclick=()=>{S.approved=true;S.phase='run';draw();};
document.getElementById('reset').onclick=reset;reset();
</script></body></html>
