<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 35 · 端到端 RAG 知识库问答系统</title>
<style>
  :root{--bg:#0e1117;--card:#161b22;--line:#283143;--fg:#e6edf3;--mut:#8b949e;--accent:#58a6ff;--ok:#3fb950;--warn:#f0883e;--bad:#da3633}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,"PingFang SC",Segoe UI,sans-serif}
  header{padding:24px 24px 6px;text-align:center}
  h1{margin:0;font-size:23px}
  .sub{color:var(--mut);margin-top:6px}
  .wrap{max-width:1080px;margin:0 auto;padding:14px;display:grid;gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  h2{margin:0 0 10px;font-size:16px}
  h2 small{color:var(--mut);font-weight:400;font-size:12px}
  canvas{width:100%;background:#0b0f15;border-radius:8px;display:block}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
  button{background:var(--accent);color:#06121f;border:0;padding:8px 16px;border-radius:8px;font-weight:600;cursor:pointer}
  button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:5px 12px;border:1px solid var(--line);border-radius:20px;cursor:pointer;color:var(--mut);font-size:13px}
  .chip.on{background:var(--accent);color:#06121f;border-color:var(--accent)}
  p.note{color:var(--mut);font-size:13px;margin:8px 0 0}
  .stat{font-variant-numeric:tabular-nums;color:var(--ok);font-weight:600}
</style>
</head>
<body>
<header>
  <h1>Day 35 · 端到端 RAG 知识库问答系统</h1>
  <div class="sub">选个问题，看它走完 7 段流水线：chunk → embed → 向量库 → 混合检索 → rerank → 带引用生成</div>
</header>
<div class="wrap">
  <div class="card">
    <h2>① 选个问题 <small>看命中哪些文档、天气干扰块被剔除</small></h2>
    <div class="chips" id="qChips"></div>
  </div>
  <div class="card">
    <h2>② RAG 流水线 <small>逐段亮起，绿=命中并送下游 橙=召回但被精排淘汰 灰=未召回</small></h2>
    <canvas id="pipe" height="360"></canvas>
    <div class="row">
      <button id="run">▶ 跑一次</button>
      <button id="step" class="ghost">单步</button>
      <span>阶段 <span class="stat" id="stage">—</span></span>
      <span>答案 <span class="stat" id="ans">—</span></span>
    </div>
    <p class="note">向量分=语义近似、关键词分=术语命中，融合后宽召回 Top-5；rerank 精排 Top-3 进生成；干扰块全程出局。</p>
  </div>
</div>
<script>
// 知识库：7 个块。每块对每个问题预设 向量分v / 关键词分k（演示用，模拟 nomic+BM25）
const DOCS=[
 {id:'rag.md',  t:'RAG=检索增强生成',     s:{0:[.92,1],1:[.3,0],2:[.5,1]}},
 {id:'chunk.md',t:'分块/重叠 overlap',    s:{0:[.4,0],1:[.93,1],2:[.35,0]}},
 {id:'vec.md',  t:'向量库 ANN/HNSW',      s:{0:[.6,1],1:[.4,0],2:[.7,1]}},
 {id:'rerank.md',t:'rerank Cross-Encoder',s:{0:[.45,0],1:[.4,0],2:[.94,1]}},
 {id:'hybrid.md',t:'混合检索 BM25',       s:{0:[.55,0],1:[.5,0],2:[.6,0]}},
 {id:'eval.md', t:'评估 RAGAS/缓存',      s:{0:[.5,1],1:[.45,0],2:[.4,0]}},
 {id:'weather.md',t:'今天天气晴 ☀ 干扰',  s:{0:[.08,0],1:[.05,0],2:[.06,0]}},
];
const QS=[{q:'什么是 RAG？',a:'RAG=先检索后生成，减少幻觉[1]'},
         {q:'分块为什么要重叠？',a:'重叠保留边界语义[1]'},
         {q:'rerank 和向量检索差别？',a:'rerank 更准但慢，精排[1]'}];
let qi=0,stage=0;
const STAGES=['文档','分块chunk','嵌入embed','向量库','混合检索','rerank','生成+引用'];
function score(){return DOCS.map(d=>{const[v,k]=d.s[qi];return{...d,v,k,sc:0.6*v+0.4*k}})}
function ranked(){const a=score().sort((x,y)=>y.sc-x.sc);a.forEach((d,i)=>{d.recall=i<5;d.top=i<3});return a}
const c=document.getElementById('pipe'),x=c.getContext('2d');
function clr(){c.width=c.clientWidth*2;c.height=c.clientHeight*2;x.scale(2,2);x.clearRect(0,0,c.clientWidth,c.clientHeight)}
function draw(){clr();const W=c.clientWidth,H=c.clientHeight;const r=ranked();
 const cx=[40,180,180,180,520,720,920];
 // 流水线节点条
 x.fillStyle='#8b949e';x.font='12px sans-serif';
 for(let i=0;i<STAGES.length;i++){const on=stage>=i;x.fillStyle=on?'#58a6ff':'#283143';x.fillRect(cx[i]>900?900:cx[i]*1.0/1080*W,8,3,H-16);}
 x.fillStyle='#8b949e';x.fillText('query: '+QS[qi].q,40,H-6);
 r.forEach((d,i)=>{const y=34+i*44;
   const col=!d.recall?'#3a414d':d.top?'#3fb950':'#f0883e';
   const dim=d.id==='weather.md';
   x.globalAlpha=stage>=2?1:.35;
   x.fillStyle=dim?'#5a2222':'#1b2230';x.strokeStyle=col;x.lineWidth=2;
   x.fillRect(40,y,W-80,30);x.strokeRect(40,y,W-80,30);
   x.fillStyle=dim?'#da3633':'#e6edf3';x.font='13px sans-serif';x.fillText(d.id+'  '+d.t,52,y+20);
   if(stage>=4){x.fillStyle='#8b949e';x.font='11px sans-serif';x.fillText('v='+d.v.toFixed(2)+' k='+d.k,W-180,y+13);x.fillStyle=col;x.fillText('score='+d.sc.toFixed(2)+(d.top?' ★top3':d.recall?' 召回':' 出局'),W-180,y+27)}
 });x.globalAlpha=1;
 document.getElementById('stage').textContent=STAGES[stage];
 document.getElementById('ans').textContent=stage>=6?QS[qi].a:'—';
}
function chips(){const el=document.getElementById('qChips');el.innerHTML='';QS.forEach((q,i)=>{const s=document.createElement('span');s.className='chip'+(i===qi?' on':'');s.textContent=q.q;s.onclick=()=>{qi=i;stage=0;chips();draw()};el.appendChild(s)})}
document.getElementById('step').onclick=()=>{stage=(stage+1)%7;draw()};
document.getElementById('run').onclick=()=>{stage=0;draw();const t=setInterval(()=>{stage++;draw();if(stage>=6)clearInterval(t)},420)};
chips();draw();window.onresize=draw;
</script>
</body>
</html>
